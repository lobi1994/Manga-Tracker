        throw new Error(j.error);
      }
      return j ? j.result : null;
    });
  };

  function showSetup(canCancel) {
    var box = document.getElementById('mtSetup');
    Array.prototype.forEach.call(box.querySelectorAll('[data-mts]'), function (el) { el.textContent = tx(el.getAttribute('data-mts')); });
    document.getElementById('mtsCancel').hidden = !canCancel;
    if (window.MT_CFG) { document.getElementById('mtsUrl').value = MT_CFG.u; document.getElementById('mtsKey').value = MT_CFG.k; }
    box.hidden = false;
  }
  window.mtShowSetup = showSetup;

  document.addEventListener('DOMContentLoaded', function () {
    var err = document.getElementById('mtsErr');
    document.getElementById('mtsSave').onclick = function () {
      var link = document.getElementById('mtsLink').value, o = null;
      if (link.trim()) { o = decode(link); if (!o) { err.textContent = tx('bad'); err.hidden = false; return; } }
      else {
        o = { u: document.getElementById('mtsUrl').value.trim(), k: document.getElementById('mtsKey').value.trim() };
        if (!valid(o)) { err.textContent = /^https:\/\/script\.google\.com\//.test(o.u) ? tx('bad') : tx('badUrl'); err.hidden = false; return; }
      }
      store(o);
      // Clear the old cache of another list, then start fresh with the setup link in the address
      try { localStorage.removeItem('mt-cache-v1'); } catch (e) {}
      var data = btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      location.replace(location.pathname + '#setup=' + data);
      location.reload();
    };
    document.getElementById('mtsCancel').onclick = function () { document.getElementById('mtSetup').hidden = true; };
    if (!window.MT_CFG) { showSetup(false); return; }

    // Link to the sheet and a small "change connection" button at the bottom
    window.mtCall('apiInfo', []).then(function (i) {
      var a = document.getElementById('mtSheetLink');
      if (a && i && i.sheetUrl) a.href = i.sheetUrl;
    }).catch(function () {});
    setTimeout(function () {
      var b = document.createElement('button');
      b.type = 'button'; b.id = 'mtConn'; b.textContent = tx('conn');
      b.onclick = function () { showSetup(true); };
      document.body.appendChild(b);
    }, 0);
  });
})();
</script>

async function save(id,patch){
  const i=items.findIndex(x=>x.id===id); const before=i>=0?{...items[i]}:null;
  if(i>=0){items[i]={...items[i],...patch};renderAll()}
  try{put(await run("apiSpeichern",id,patch));return true}
  catch(e){if(before){items[i]=before;renderAll()}err(e);return false}
}

/* Bild-Adressen: Drive-Bilder zuerst über lh3 (zuverlässig), dann Vorschaubild, dann Originalquelle */
function imgUrls(main,src){
  const out=[]; const m=String(main||"").match(/drive\.google\.com\/(?:thumbnail\?id=|uc\?(?:export=view&)?id=|file\/d\/)([\w-]+)/);
  if(m)out.push("https://lh3.googleusercontent.com/d/"+m[1]+"=w400");
  if(main)out.push(main); if(src&&src!==main)out.push(src);
  return out;
}
function imgTag(list,extra){
  if(!list.length)return"";
  return `<img src="${esc(list[0])}"${list.length>1?` data-alt="${esc(list.slice(1).join("|"))}"`:""} alt="" draggable="false" ${extra||""} referrerpolicy="no-referrer" onerror="imgErr(this)">`;
}
function cover(i,cls,tag){
  tag=tag||"button";
  const list=imgUrls(i.image,i.imageSrc); const img=list.length;
  const ph=cls==="tile"?esc(i.title):esc(((i.title||"?").trim()[0]||"?").toUpperCase());
  const attrs=tag==="button"?` type="button" data-detail="${esc(i.id)}" aria-label="${esc(i.title)}"`:"";
  return `<${tag} class="${cls}${img?" hasimg":""}"${attrs}>${imgTag(list,'loading="lazy" decoding="async"')}<span class="ph">${ph}</span></${tag}>`;
}
window.imgErr=function(el){
  const rest=(el.dataset.alt||"").split("|").filter(Boolean);
  if(rest.length){el.dataset.alt=rest.slice(1).join("|");el.src=rest[0];return}
  if(el.parentElement)el.parentElement.classList.remove("hasimg"); el.remove();
};

/* ---------- next chapter ---------- */
function nextState(i){
  if(i.chapter==null||i.source==="webtoon")return null; const n=Math.floor(i.chapter)+1;
  if(i.latest!=null&&n<=i.latest)return "free";
  if(i.lockedCh&&n<=i.lockedCh)return "locked";
  return i.check&&i.check.ch===n?i.check.st:null;
}
const unread=i=>(i.source!=="webtoon"&&i.latest!=null&&i.chapter!=null)?Math.max(0,i.latest-Math.floor(i.chapter)):0;
function readLinks(i){
  const ov=i.overview?`<a href="${escUrl(i.overview)}" target="_blank" rel="noopener">${t("overview")}</a>`:"";
  if(!i.next)return ov||(i.url?`<a href="${escUrl(i.url)}" target="_blank" rel="noopener">${t("read")}</a>`:"");
  const n=Math.floor(i.chapter)+1, a=nextState(i);
  if(a==="no")return `<span>${t("notYet",n)}</span>${ov}`;
  if(a==="locked")return `<a href="${escUrl(i.next)}" target="_blank" rel="noopener">${t("locked",n)} ↗</a>${ov}`;
  return `<a href="${escUrl(i.next)}" target="_blank" rel="noopener"><b>${t("next",n)}${a==="free"?" ✓":""}</b> ↗</a>${ov}`;
}
function relInfo(i){
  const out=[]; const u=unread(i);
  if(u>0)out.push(`<span class="unread">${t("unread",u,i.latest)}</span>`);
  if(i.back)out.push(`<span class="backpill">🔥 ${t("back")}</span>`);
  if(i.relDate===today())out.push(`<span class="newpill">${t("newToday")}</span>`);
  if(i.relDay)out.push(`<span>${t("relDay",i.relDay)}</span>`);
  if(i.notify)out.push(`<span title="${esc(t("notifyOn"))}">🔔</span>`);
  return out.join("");
}

/* ---------- tracker view ---------- */
/* Filter: 1× tippen = anzeigen (oder-verknüpft), 2× = ausschließen, 3× = zurücksetzen */
const gInc=new Set(), gExc=new Set(), sInc=new Set(), sExc=new Set();
function cycle(inc,exc,k){ if(inc.has(k)){inc.delete(k);exc.add(k)} else if(exc.has(k))exc.delete(k); else inc.add(k) }
const fState=(inc,exc,k)=>inc.has(k)?"inc":exc.has(k)?"exc":"";
function chipAttrs(state,label){return `aria-pressed="${state==="inc"}" data-state="${state}" aria-label="${esc((state==="exc"?t("excl")+": ":"")+label)}"`}
function renderTabs(){
  const cats=allCats(); const hasNone=items.some(i=>!(i.genres||[]).length);
  const tabs=[...cats.map(c=>[c,cs(c)]),...(hasNone||gInc.has("__none")||gExc.has("__none")?[["__none",t("noCat")]]:[])];
  const any=gInc.size||gExc.size;
  $("genreTabs").innerHTML=`<button class="tab" aria-pressed="${!any}" data-g="__all">${esc(t("all"))}</button>`
    +tabs.map(([k,l])=>{const st=fState(gInc,gExc,k);return `<button class="tab${st==="exc"?" exc":""}" ${chipAttrs(st,l)} data-g="${esc(k)}">${st==="exc"?"✕ ":""}${esc(l)}</button>`}).join("");
}
$("genreTabs").addEventListener("click",e=>{const b=e.target.closest("button[data-g]");if(!b)return;const k=b.dataset.g;
  if(k==="__all"){gInc.clear();gExc.clear()}else cycle(gInc,gExc,k); renderAll()});
function inGenre(i){
  const g=i.genres||[]; const has=k=>k==="__none"?!g.length:g.includes(k);
  if(gInc.size&&![...gInc].some(has))return false;
  if([...gExc].some(has))return false;
  return true;
}
const SFLAG={__back:i=>!!i.back,__unread:i=>unread(i)>0,__mu:i=>i.dbStatus==="unsicher"};
const sHas=(i,k)=>SFLAG[k]?SFLAG[k](i):(i.status||"__none")===k;
function inStatus(i){
  const incOther=[...sInc].filter(k=>k!=="__unread");
  if(incOther.length&&!incOther.some(k=>sHas(i,k)))return false;
  if(sInc.has("__unread")&&!(unread(i)>0))return false;
  if([...sExc].some(k=>sHas(i,k)))return false;
  return true;
}
function renderStats(){
  const pool=items.filter(inGenre);
  const c={};pool.forEach(i=>{const s=i.status||"__none";c[s]=(c[s]||0)+1});
  const show=k=>c[k]||sInc.has(k)||sExc.has(k);
  const keys=[...STATUS,"__none"].filter(show);
  const nb=pool.filter(i=>i.back).length, nu=pool.filter(i=>unread(i)>0).length, nm=pool.filter(i=>i.dbStatus==="unsicher").length;
  const chip=(k,cls,label,n)=>{const st=fState(sInc,sExc,k);return `<button class="stat${cls?" "+cls:""}${st==="exc"?" exc":""}" ${chipAttrs(st,label)} data-s="${esc(k)}">${st==="exc"?"✕ ":""}${esc(label)} <b>${n}</b></button>`};
  const any=sInc.size||sExc.size||gInc.size||gExc.size;
  $("stats").innerHTML=(nb||show("__back")?chip("__back","backstat","🔥 "+t("back"),nb):"")
    +(nm||show("__mu")?chip("__mu","","❓ "+t("muCheck"),nm):"")
    +(nu||show("__unread")?chip("__unread","unreadstat","📚 "+t("unreadStat"),nu):"")
    +keys.map(k=>chip(k,"",k==="__none"?t("noStatus"):sl(k),c[k]||0)).join("")
    +(any?`<button class="stat clearf" data-s="__clear">${esc(t("clearF"))}</button>`:"")
    +`<span class="note fhint">${esc(t("fHint"))}</span>`;
}
$("stats").addEventListener("click",e=>{const b=e.target.closest("button[data-s]");if(!b)return;const k=b.dataset.s;
  if(k==="__clear"){sInc.clear();sExc.clear();gInc.clear();gExc.clear()}else cycle(sInc,sExc,k); renderAll()});
const opt=(arr,cur,empty,lab)=>`<option value="">${esc(empty)}</option>`+arr.map(v=>`<option value="${esc(v)}"${v===cur?" selected":""}>${esc(lab?lab(v):v)}</option>`).join("");
function row(i){
  const st=i.status||""; const g=i.genres||[];
  return `<div class="item${i.back?" isback":""}" data-id="${esc(i.id)}">
    <div class="g" style="background:${catColor(g[0])}"></div>

      <div class="meta">

        <select data-f="rating" aria-label="${esc(t("fRating"))}">${opt(RATINGS,i.rating||"","★ –")}</select>
        ${i.lastRead?`<span>${t("readOn",fmtDate(i.lastRead))}</span>`:""}

        ${i.note?`<span>· ${esc(i.note)}</span>`:""}</div></div>
    <div class="ch"><button data-d="-1" aria-label="${esc(t("chBack"))}">−</button><span class="num${i.chapter==null?" empty":""}">${fmtCh(i.chapter)}</span><button data-d="1" aria-label="${esc(t("chFwd"))}">+</button></div>
  </div>`;
}
function renderShelf(){
  const q=norm($("q").value);
  let list=items.filter(i=>inGenre(i)&&inStatus(i)&&(!q||norm(i.title+" "+(i.alt||[]).join(" ")).includes(q)));
  const sort=prefs.sort;
  const sOrd=s=>{const k=STATUS.indexOf(s);return k<0?2.5:k};
  const byT=(a,b)=>a.title.localeCompare(b.title);
  if(sort==="recent")list.sort((a,b)=>(b.lastRead||"").localeCompare(a.lastRead||"")||(b.readAt||0)-(a.readAt||0)||byT(a,b));
  else if(sort==="title")list.sort(byT);
  else if(sort==="rating")list.sort((a,b)=>(parseInt(b.rating)||0)-(parseInt(a.rating)||0)||byT(a,b));
  else if(sort==="unread")list.sort((a,b)=>unread(b)-unread(a)||byT(a,b));
  else list.sort((a,b)=>sOrd(a.status)-sOrd(b.status)||byT(a,b));
  if(!items.length){$("shelf").innerHTML=`<div class="list"><div class="empty-state">${loaded?t("empty"):t("loading")}</div></div>`;return}
  if(!list.length){$("shelf").innerHTML=`<div class="list"><div class="empty-state">${t("nothing")}</div></div>`;return}
  let html="";
  if(sort==="genre"){
    const cats=allCats().filter(c=>!gExc.has(c)&&(!gInc.size||gInc.has(c)));
    for(const c of cats){const part=list.filter(i=>(i.genres||[]).includes(c));if(!part.length)continue;
      html+=`<div class="group-h"><span class="dot" style="background:${catColor(c)}"></span><h2>${esc(cl(c))}</h2><span class="n">${part.length}</span></div><div class="list">${part.map(row).join("")}</div>`}
    const rest=(!gInc.size||gInc.has("__none"))?list.filter(i=>!(i.genres||[]).length):[];
    if(rest.length)html+=`<div class="group-h"><h2>${t("noCat")}</h2><span class="n">${rest.length}</span></div><div class="list">${rest.map(row).join("")}</div>`;
  }else html=`<div class="list">${list.map(row).join("")}</div>`;
  $("shelf").innerHTML=html;
}

}

function shrink(file){return new Promise((res,rej)=>{
  const img=new Image(); const url=URL.createObjectURL(file);
  img.onload=()=>{const max=700;let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);

    res(c.toDataURL("image/jpeg",0.85).split(",")[1])};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("img"))}; img.src=url;})}

/* ---------- tier list as PNG ---------- */
const TCOL={S:"#b8433a",A:"#c27a1e",B:"#9c8a1f",C:"#4f8a4c",D:"#3f6f9a",E:"#6b5a9a"};
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function wrapText(ctx,txt,maxW,maxLines){
  const words=String(txt).split(/\s+/);const lines=[];let cur="";
  for(const w of words){const test=cur?cur+" "+w:w; if(ctx.measureText(test).width<=maxW||!cur)cur=test; else{lines.push(cur);cur=w}}
  if(cur)lines.push(cur);
  if(lines.length>maxLines){lines.length=maxLines;lines[maxLines-1]=lines[maxLines-1].replace(/.{0,2}$/,"")+"…"}
  return lines;
}
async function drawTier(rated,imgs){
  const S=1.5,W=1200,pad=32,lab=110,tw=96,th=136,gap=10,headH=78;
  const per=Math.max(1,Math.floor((W-pad*2-lab-gap)/(tw+gap)));
  const tiers=TIERS.map(([k,vals])=>[k,rated.filter(i=>vals.includes(parseInt(i.rating,10))).sort((a,b)=>parseInt(b.rating)-parseInt(a.rating)||a.title.localeCompare(b.title))]);
  const hs=tiers.map(([k,l])=>Math.max(1,Math.ceil(l.length/per))*(th+gap)+gap);
  const H=pad+headH+hs.reduce((a,b)=>a+b,0)+40+pad;
  const c=document.createElement("canvas");c.width=W*S;c.height=H*S;const x=c.getContext("2d");x.scale(S,S);
  const disp='"Shippori Mincho B1","Times New Roman",serif', body='"Zen Kaku Gothic New",Arial,sans-serif';
  x.fillStyle="#f6f6f2";x.fillRect(0,0,W,H);
  x.fillStyle="#1c1d22";x.font=`800 36px ${disp}`;x.textBaseline="alphabetic";x.fillText("Manga Tracker · Tier List",pad,pad+38);
  x.fillStyle="#686a73";x.font=`500 15px ${body}`;
  x.fillText(t("pngSub",rated.length,new Date().toLocaleDateString(prefs.lang==="de"?"de-DE":"en-GB",{day:"2-digit",month:"long",year:"numeric"})),pad,pad+64);
  let y=pad+headH; const totalH=hs.reduce((a,b)=>a+b,0);
  x.save();rr(x,pad,y,W-pad*2,totalH,12);x.fillStyle="#ffffff";x.fill();x.clip();
  tiers.forEach(([k,list],ti)=>{
    const h=hs[ti];
    x.fillStyle=TCOL[k];x.fillRect(pad,y,lab,h);
    x.fillStyle="#ffffff";x.font=`800 46px ${disp}`;x.textAlign="center";x.textBaseline="middle";x.fillText(k,pad+lab/2,y+h/2+2);
    x.textAlign="left";
    if(!list.length){x.fillStyle="#9a9ca6";x.font=`500 18px ${body}`;x.textBaseline="middle";x.fillText("–",pad+lab+gap+4,y+h/2)}
    list.forEach((it,idx)=>{
      const col=idx%per,row=Math.floor(idx/per);const tx=pad+lab+gap+col*(tw+gap),ty=y+gap+row*(th+gap);
      x.save();rr(x,tx,ty,tw,th,6);x.clip();
      const im=imgs[it.id];
      if(im&&im.width){const ir=im.width/im.height,tr=tw/th;let sx=0,sy=0,sw=im.width,sh=im.height;
        if(ir>tr){sw=im.height*tr;sx=(im.width-sw)/2}else{sh=im.width/tr;sy=(im.height-sh)/2}
        x.drawImage(im,sx,sy,sw,sh,tx,ty,tw,th)}
      else{x.fillStyle="#ecece6";x.fillRect(tx,ty,tw,th);x.fillStyle="#1c1d22";x.textAlign="center";x.textBaseline="top";
        let fs=12; x.font=`700 ${fs}px ${body}`;
        while(fs>8&&String(it.title).split(/\s+/).some(w=>x.measureText(w).width>tw-12)){fs--;x.font=`700 ${fs}px ${body}`}
        const lines=wrapText(x,it.title,tw-12,7);const lh=fs+3;const top=ty+(th-lines.length*lh)/2;lines.forEach((l,li)=>x.fillText(l,tx+tw/2,top+li*lh));x.textAlign="left"}
      x.restore();
    });
    y+=h;
    if(ti<tiers.length-1){x.fillStyle="#dedfd8";x.fillRect(pad,y-0.5,W-pad*2,1)}
  });
  x.restore();
  x.strokeStyle="#dedfd8";x.lineWidth=1;rr(x,pad+0.5,pad+headH+0.5,W-pad*2-1,totalH-1,12);x.stroke();
  x.fillStyle="#686a73";x.font=`500 13px ${body}`;x.textBaseline="alphabetic";x.fillText(t("pngLegend"),pad,H-pad+4);
  return new Promise(res=>c.toBlob(res,"image/png"));
}

function recCard(r){
  const why=r.kind==="sequel"?t("recSeqWhy",...String(r.why).split("|")):(r.why?t("recWhy",String(r.why).split(" | ").join(", ")):"");
  const d=prefs.lang==="de"?(r.descDe||r.desc):(r.desc||r.descDe);
  const offs=String(r.official||"").split(" ; ").map(x=>x.split("|")).filter(x=>x[0]&&x[1]);
  const c={title:r.title,image:r.cover,imageSrc:""};
  return `<div class="rec" data-rec="${esc(r.id)}">${cover(c,"cover","div")}<div class="rbody">
    <h3>${esc(r.title)}</h3>
    <div class="meta">${r.avg?`<span>★ ${r.avg}%</span>`:""}${r.chapters?`<span>${t("recCh",r.chapters,r.approx)}</span>`:""}<span>${r.country==="KR"?"Manhwa":r.country==="CN"||r.country==="TW"?"Manhua":esc(r.country)}</span>${r.genres.length?`<span>${esc(r.genres.slice(0,3).join(", "))}</span>`:""}</div>
    ${why?`<div class="note">${esc(why)}</div>`:""}
    ${d?`<details><summary>${t("recDesc")}</summary><p class="desc" style="margin:6px 0 0">${esc(d)}</p></details>`:""}
    <div class="meta">${r.url?`<a href="${escUrl(r.url)}" target="_blank" rel="noopener">AniList ↗</a>`:""}${offs.map(([s2,u])=>`<a href="${escUrl(u)}" target="_blank" rel="noopener">${esc(s2)} ↗</a>`).join("")}</div>
    <div class="acts"><button type="button" class="primary" data-ra="add">${t("recAdd")}</button><button type="button" data-ra="no">${t("recNo")}</button></div>
  </div></div>`;
}
function renderRecs(){
  if(!$("recList"))return;
  if(recLoading&&!recs){$("recList").innerHTML=`<div class="list"><div class="empty-state">${t("loading")}</div></div>`;$("recNote").textContent="";return}
  if(!recs){$("recList").innerHTML="";return}
  const fmt=x=>new Date(x).toLocaleString(prefs.lang==="de"?"de-DE":"en-GB",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
  $("recNote").textContent=recLoading?t("recUpdating"):(recUpd?t("recUpdated",fmt(recUpd)):"");
  if(!recs.length){$("recList").innerHTML=`<div class="list"><div class="empty-state">${t("recNone")}</div></div>`;return}
  const min=Number(prefs.recMin||0), ctry=prefs.recCountry||"all", sort=prefs.recSort||"match";
  const okR=r=>(!min||(r.chapters!=null&&r.chapters>=min))&&(ctry==="all"||(ctry==="KR"?r.country==="KR":r.country==="CN"||r.country==="TW"));
  const srt=(a,b)=>sort==="avg"?(b.avg||0)-(a.avg||0):sort==="ch"?(b.chapters||0)-(a.chapters||0):(b.score||0)-(a.score||0);
  const main=recs.filter(r=>r.kind!=="sequel"&&okR(r)).sort(srt), seq=recs.filter(r=>r.kind==="sequel"&&okR(r)).sort(srt);

const TV={S:[10],A:[9,8],B:[7,6],C:[5,4],D:[3,2],E:[1]}; const TORD=["S","A","B","C","D","E"];

let drag=null;

function beginDrag(){
  const it=items.find(x=>x.id===drag.id); if(!it){drag=null;return}
  drag.active=true; suppressClick=true; drag.from=tierOf(it.rating);

async function drawShareCard(i,img){

  if(img&&img.width){const ir=img.width/img.height,tr=cw/ch;let sx=0,sy=0,sw=img.width,sh=img.height;if(ir>tr){sw=img.height*tr;sx=(img.width-sw)/2}else{sh=img.width/tr;sy=(img.height-sh)/2}x.drawImage(img,sx,sy,sw,sh,cx,cy,cw,ch)}

  x.restore();

  if(i.rating){const k=tierOf(i.rating);x.fillStyle="#5fb3a0";x.font=`700 52px ${body}`;x.fillText(`★ ${i.rating}${k?`  ·  ${k}-Tier`:""}`,W/2,y+30);y+=80}
  const link=i.overview||i.url; if(link){x.fillStyle="#9a9ca6";x.font=`500 28px ${body}`;const l=wrapText(x,link.replace(/^https?:\/\//,""),W-160,2);l.forEach(s2=>{x.fillText(s2,W/2,Math.min(y+20,H-80));y+=36})}
  x.fillStyle="#6b6d77";x.font=`500 24px ${body}`;x.fillText("Manga Tracker",W/2,H-40);
  return new Promise(res=>c.toBlob(res,"image/png"));

<script>
/* Release day: show "continue" only once the usual release day has passed since you last read */
(function(){
  I18N.en.waitNext = function (n, d) { return 'No new chapter yet \u00b7 ch. ' + n + ' expected ' + d; };
  I18N.de.waitNext = function (n, d) { return 'Noch kein neues Kapitel \u00b7 Kap. ' + n + ' erwartet am ' + d; };
  function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function waitInfo(i) {
    if (!i.relDay || i.chapter == null || !i.lastRead) return null;
    if (i.status === 'Beendet' || i.status === 'Abgebrochen') return null;
    var st = i.source === 'webtoon' ? null : nextState(i);
    if (st === 'free' || st === 'locked' || unread(i) > 0) return null;
    var now = new Date(); now.setHours(12, 0, 0, 0);
    var iso = (now.getDay() + 6) % 7 + 1;
    var last = new Date(now); last.setDate(now.getDate() - ((iso - i.relDay + 7) % 7));
    if (ymd(last) > String(i.lastRead).slice(0, 10)) return null;
    var next = new Date(last); next.setDate(last.getDate() + 7);
    return { n: Math.floor(i.chapter) + 1, date: next };
  }
  window.waitInfo = waitInfo;
  function waitText(i, w) {
    var de = prefs.lang === 'de';
    var ds = w.date.toLocaleDateString(de ? 'de-DE' : 'en-US', de ? { weekday: 'long', day: '2-digit', month: '2-digit' } : { weekday: 'long', month: 'long', day: 'numeric' });
    return t('waitNext', w.n, ds);
  }
  var baseLinks = readLinks;
  readLinks = function (i) {
    if (!waitInfo(i)) return baseLinks(i);
    return i.overview ? '<a href="' + escUrl(i.overview) + '" target="_blank" rel="noopener">' + t('overview') + '</a>' : '';
  };
  /* second line of the card: waiting note, reminders, unread, release day */
  var baseRel = relInfo;
  relInfo = function (i) {
    var w = waitInfo(i);
    var h = (w ? '<span>' + esc(waitText(i, w)) + '</span>' : '') + baseRel(i);
    return h ? '<span class="mt-brk"></span>' + h : '';
  };
  var css = document.createElement('style');
  css.textContent = '.mt-brk{flex-basis:100%;height:0;margin:0;padding:0}';
  document.head.appendChild(css);
  try { renderAll(); } catch (e) {}
})();
</script>

<script>
/* Faster start: show the list saved on this device right away, then replace it with fresh data. Also measures load times. */
(function(){
  var CK = 'mt-cache-v1', saved = 0, cacheMs = null, freshMs = null;
  var de = function () { return prefs.lang === 'de'; };
  var fmt = function (ms) { var v = (ms / 1000).toFixed(1); return (de() ? v.replace('.', ',') : v) + ' s'; };
  var label = document.getElementById('appVersion');
  var base = label ? label.textContent : '';
  function setLabel() {
    if (!label) return;
    var p = [base];
    if (cacheMs != null) p.push((de() ? 'gespeicherte Liste nach ' : 'saved list after ') + fmt(cacheMs));
    if (freshMs != null) p.push((de() ? 'aktuelle Liste nach ' : 'fresh list after ') + fmt(freshMs));
    label.textContent = p.join(' \u00b7 ');
  }
  var css = document.createElement('style');
  css.textContent = 'body.mt-stale #shelf .ch,body.mt-stale #shelf select,body.mt-stale #shelf .t,body.mt-stale #btnNew{pointer-events:none;opacity:.55}';
  document.head.appendChild(css);
  if (!loaded) {
    try {
      var c = JSON.parse(localStorage.getItem(CK) || 'null');
      if (c && c.items && c.items.length) {
        items = c.items; if (c.cats) serverCats = c.cats;
        document.body.classList.add('mt-stale');
        renderAll();
        cacheMs = performance.now();
      }
    } catch (e) {}
  }
  setLabel();
  setInterval(function () {
    if (!loaded || !lastLoad || lastLoad === saved) return;
    saved = lastLoad;
    if (freshMs == null) { freshMs = performance.now(); document.body.classList.remove('mt-stale'); }
    setLabel();
    try { localStorage.setItem(CK, JSON.stringify({ items: items, cats: serverCats, at: Date.now() })); } catch (e) {}
  }, 250);
})();

  var bMode = document.createElement('button'); bMode.type = 'button'; bMode.className = 'icbtn';
  if (row) { row.insertBefore(bMode, row.firstChild); row.insertBefore(bStyle, row.firstChild); }
  bStyle.onclick = function () { look.style = STY[(STY.indexOf(look.style) + 1) % STY.length]; apply(); toast((prefs.lang === 'de' ? 'Stil: ' : 'Style: ') + nm(look.style)); };
  bMode.onclick = function () { look.mode = MOD[(MOD.indexOf(look.mode) + 1) % MOD.length]; apply(); toast((prefs.lang === 'de' ? 'Darstellung: ' : 'Appearance: ') + nm(look.mode)); };
  function labels() {
    bMode.innerHTML = ICS[look.mode];
    var a = (prefs.lang === 'de' ? 'Darstellung: ' : 'Appearance: ') + nm(look.mode), b = (prefs.lang === 'de' ? 'Stil: ' : 'Style: ') + nm(look.style);
    bMode.title = a; bMode.setAttribute('aria-label', a); bStyle.title = b; bStyle.setAttribute('aria-label', b);
  }

  // Background: covers of the top-rated series
  var banner = document.createElement('div'); banner.id = 'mtBanner'; banner.setAttribute('aria-hidden', 'true');
  document.body.insertBefore(banner, document.body.firstChild);
  var lastKey = '';
  function topCovers() {
    var list = items.filter(function (i) { return parseInt(i.rating, 10) > 0 && imgUrls(i.image, i.imageSrc).length; });
    list.sort(function (a, b) { return (parseInt(b.rating, 10) - parseInt(a.rating, 10)) || String(b.lastRead || '').localeCompare(String(a.lastRead || '')); });
    return list.slice(0, 7);
  }
  function renderBanner() {
    var top = topCovers(), key = top.map(function (i) { return i.id + (i.image || ''); }).join('|');
    if (key === lastKey) return; lastKey = key;
    var rot = [-4, 3, -2, 4, -3, 2, -5];
    banner.innerHTML = top.map(function (i, k) {
      var u = imgUrls(i.image, i.imageSrc);
      return '<img alt="" loading="lazy" style="--r:' + rot[k] + 'deg" src="' + esc(u[0]) + '" data-alt="' + esc(u.slice(1).join('|')) + '" onerror="this.remove()">';
    }).join('');
  }
  var baseAll = renderAll;
  renderAll = function () { baseAll.apply(this, arguments); try { renderBanner(); } catch (e) {} };
  var baseLang = applyLang;
  applyLang = function () { baseLang.apply(this, arguments); labels(); };

  window.mtLook = { get: function () { return { style: look.style, mode: look.mode }; }, set: function (s2, m2) { if (s2) look.style = s2; if (m2) look.mode = m2; apply(); }, banner: banner, styleBtn: bStyle, name: nm };
  apply();
  try { renderBanner(); } catch (e) {}
})();
</script>
<dialog id="lookDlg"><div class="dlg">
  <h2 id="lkTitle"></h2>
  <div class="lkgrp"><div class="lklbl" id="lkStyleL"></div><div class="lkseg" id="lkStyle"></div></div>
  <div class="lkgrp"><div class="lklbl" id="lkModeL"></div><div class="lkseg" id="lkMode"></div></div>
  <div class="lkgrp"><div class="lklbl" id="lkBgL"></div>
    <div class="lkbg"><div class="lkprev" id="lkPrev"></div>
      <div class="lkbtns"><button type="button" class="primary" id="lkPick"></button><button type="button" id="lkDel"></button>
      <input type="file" id="lkFile" accept="image/*" hidden></div></div>
    <label class="lkrange"><span id="lkStrL"></span><input type="range" id="lkStr" min="30" max="100" step="5"></label>
    <div class="note" id="lkHint"></div>
  </div>
  <div class="row" style="justify-content:flex-end"><button type="button" class="primary" id="lkClose"></button></div>
</div></dialog>
<script>
/* v2.2: own background picture (strong at the top, fading out downwards) and an "Appearance" window */
(function(){
  if (!window.mtLook) return;
  var de = function () { return prefs.lang === 'de'; };
  var TX = {
    title: ['Appearance', 'Aussehen'], style: ['Style', 'Stil'], mode: ['Light / dark (this device)', 'Hell / Dunkel (dieses Ger\u00e4t)'],
    bg: ['Background picture (all devices)', 'Hintergrundbild (alle Ger\u00e4te)'], pick: ['Choose picture', 'Bild ausw\u00e4hlen'], del: ['Remove', 'Entfernen'],
    str: ['Strength (this device)', 'St\u00e4rke (dieses Ger\u00e4t)'], close: ['Done', 'Fertig'],
    hint: ['Landscape pictures work best. Without a picture of your own, the covers of your top-rated series are shown.', 'Am besten passen Bilder im Querformat. Ohne eigenes Bild werden die Cover deiner bestbewerteten Serien gezeigt.'],
    none: ['No picture', 'Kein eigenes Bild'], up: ['Uploading picture\u2026', 'Bild wird hochgeladen\u2026'], done: ['Background saved', 'Hintergrund gespeichert'], gone: ['Background removed', 'Hintergrund entfernt']
  };
  function tx(k) { return TX[k][de() ? 1 : 0]; }

  // Background layer
  var layer = document.createElement('div'); layer.id = 'mtBg'; layer.setAttribute('aria-hidden', 'true');
  var img = document.createElement('img'); img.alt = ''; layer.appendChild(img);
  document.body.insertBefore(layer, document.body.firstChild);
  var bg = null, SK = 'mt-bg', STRK = 'mt-bg-strength', strength = 100;
  try { bg = JSON.parse(localStorage.getItem(SK) || 'null'); } catch (e) {}
  try { var sv = parseInt(localStorage.getItem(STRK), 10); if (sv >= 30 && sv <= 100) strength = sv; } catch (e) {}
  function showBg() {
    var on = !!(bg && bg.url);
    document.documentElement.classList.toggle('has-bg', on);
    if (on) {
      if (img.dataset.id !== bg.id) { img.dataset.id = bg.id; img.dataset.tried = ''; img.src = bg.url; }
      img.onerror = function () { if (!img.dataset.tried && bg && bg.alt) { img.dataset.tried = '1'; img.src = bg.alt; } };
    } else { img.removeAttribute('src'); img.dataset.id = ''; }
    layer.style.opacity = String(strength / 100);
    renderPrev();
  }
  function setBg(v) { bg = v; try { localStorage.setItem(SK, JSON.stringify(v)); } catch (e) {} showBg(); }
  run('apiHintergrund').then(function (v) { setBg(v || null); }).catch(function () {});

  // Appearance window
  function segs(box, list, cur, onPick) {
    box.innerHTML = list.map(function (k) { return '<button type="button" data-k="' + k + '" aria-pressed="' + (k === cur) + '">' + esc(window.mtLook.name(k)) + '</button>'; }).join('');
    box.onclick = function (e) { var b = e.target.closest('button[data-k]'); if (b) { onPick(b.dataset.k); render(); } };
  }
  function renderPrev() {
    var p = $('lkPrev'); if (!p) return;
    p.innerHTML = bg && bg.url ? '<img alt="" src="' + esc(bg.url) + '" onerror="if(this.dataset.t!==\'1\'){this.dataset.t=\'1\';this.src=\'' + esc(bg && bg.alt || '') + '\'}">' : '<span>' + esc(tx('none')) + '</span>';
    $('lkDel').disabled = !(bg && bg.url);
  }
  function render() {
    var L = window.mtLook.get();
    $('lkTitle').textContent = tx('title'); $('lkStyleL').textContent = tx('style'); $('lkModeL').textContent = tx('mode');
    $('lkBgL').textContent = tx('bg'); $('lkPick').textContent = tx('pick'); $('lkDel').textContent = tx('del');
    $('lkStrL').textContent = tx('str'); $('lkClose').textContent = tx('close'); $('lkHint').textContent = tx('hint');
    segs($('lkStyle'), ['tone', 'ink', 'classic'], L.style, function (k) { window.mtLook.set(k, null); });
    segs($('lkMode'), ['auto', 'light', 'dark'], L.mode, function (k) { window.mtLook.set(null, k); });
    $('lkStr').value = strength;
    renderPrev();
  }
  function openLook() { render(); $('lookDlg').showModal(); }
  window.mtLook.styleBtn.onclick = openLook;
  window.mtLook.styleBtn.title = tx('title'); window.mtLook.styleBtn.setAttribute('aria-label', tx('title'));
  $('lkClose').onclick = function () { $('lookDlg').close(); };
  (function () { var d = $('lookDlg'), downOut = false;
    d.addEventListener('pointerdown', function (e) { downOut = e.target === d; });
    d.addEventListener('click', function (e) { if (e.target === d && downOut) d.close(); downOut = false; }); })();
  $('lkStr').addEventListener('input', function () { strength = parseInt(this.value, 10) || 100; try { localStorage.setItem(STRK, String(strength)); } catch (e) {} showBg(); });
  $('lkPick').onclick = function () { $('lkFile').click(); };
  $('lkDel').onclick = function () {
    setBg(null);
    run('apiHintergrundEntfernen').then(function () { toast(tx('gone')); }).catch(err);
  };
  $('lkFile').onchange = function () {
    var file = this.files && this.files[0]; this.value = ''; if (!file) return;
    var fr = new FileReader();
    fr.onload = function () {
      var im = new Image();
      im.onload = function () {
        var max = 2000, w = im.naturalWidth, h = im.naturalHeight, sc = Math.min(1, max / Math.max(w, h));
        var c = document.createElement('canvas'); c.width = Math.round(w * sc); c.height = Math.round(h * sc);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        var data = c.toDataURL('image/jpeg', 0.86);
        // show it right away, then save in Drive
        setBg({ id: 'local', url: data, alt: '' });
        toast(tx('up')); $('lkPick').disabled = true;
        run('apiHintergrundHochladen', data.split(',')[1], 'image/jpeg')
          .then(function (v) { setBg(v); toast(tx('done')); })
          .catch(function (e) { err(e); run('apiHintergrund').then(function (v) { setBg(v || null); }).catch(function () {}); })
          .then(function () { $('lkPick').disabled = false; });
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  };

  var css = document.createElement('style');
  css.textContent = ''
    + '#mtBg{position:absolute;z-index:0;left:0;right:0;top:0;height:min(68vh,720px);overflow:hidden;pointer-events:none;display:none;'
    + '-webkit-mask-image:linear-gradient(#000 0%,#000 22%,rgba(0,0,0,.55) 55%,transparent 100%);mask-image:linear-gradient(#000 0%,#000 22%,rgba(0,0,0,.55) 55%,transparent 100%)}'
    + '#mtBg img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}'
    + 'html.has-bg #mtBg{display:block}html.has-bg #mtBanner{display:none!important}'
    + 'html.has-bg header h1,html.has-bg header .sub{text-shadow:0 1px 3px rgba(0,0,0,.55),0 0 12px rgba(0,0,0,.35)}'
    + 'html.has-bg header .sub{color:#f3f3f3}'
    + 'html.has-bg[data-style="classic"] header h1{color:#fff}'
    + '.lkgrp{display:flex;flex-direction:column;gap:6px}.lklbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}'
    + '.lkseg{display:flex;flex-wrap:wrap;gap:6px}.lkseg button{border-radius:999px;padding:6px 12px}.lkseg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}'
    + '.lkbg{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.lkprev{width:150px;height:84px;border-radius:10px;overflow:hidden;background:var(--tone);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center}'
    + '.lkprev img{width:100%;height:100%;object-fit:cover}.lkbtns{display:flex;gap:8px;flex-wrap:wrap}'
    + '.lkrange{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}.lkrange input{width:100%;accent-color:var(--accent)}';
  document.head.appendChild(css);
  showBg();
})();
</script>
<script>document.documentElement.classList.add("mt-ready")</script>
</body>
